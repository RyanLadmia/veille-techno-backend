spring.application.name=api-kanban

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanban}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kanban}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kanban_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Polling required: Docker Desktop volume mounts often miss native file events
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

app.jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-at-least-256-bits-long!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
