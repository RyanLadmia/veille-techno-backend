openapi: 3.0.3
info:
  title: Kanban Board API
  description: >
    Contrat de référence pour l'api-kanban
servers:
  - url: /api
    description: local Swagger

tags:
  - name: Auth
    description: Inscription et connexion
  - name: Users
    description: Gestion des utilisateurs
  - name: Lists
    description: Gestion des listes du Kanban
  - name: Cards
    description: Gestion des cartes du Kanban

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscrire un nouvel utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                email: "alice@example.com"
                name: "Alice"
                role: user
                createdAt: "2026-01-15T10:00:00Z"
        "400":
          description: Validation échouée (email invalide, mot de passe trop court, champs manquants)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Validation failed
                errors:
                  email: must be a well-formed email address
                  password: size must be at least 8 character
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Email already used

  /auth/login:
    post:
      tags: [Auth]
      summary: Connecter un utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4iLCJleHAiOjE3MDAwMDAwMDB9.signature
        "401":
          description: Identifiants invalides (email inconnu ou mot de passe incorrect — message générique)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid email or password

  /users/me:
    get:
      tags: [Users]
      summary: Récupérer le profil de l'utilisateur connecté
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                email: "alice@example.com"
                name: "Alice"
                role: user
                createdAt: "2026-01-15T10:00:00Z"
        "401":
          description: Authentification manquante ou token invalide/expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unauthorized

  /users/{id}:
    patch:
      tags: [Users]
      summary: Modifier les informations d'un utilisateur (y compris ses droits)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Payload invalide (ex. rôle non reconnu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Accès refusé — modification d'un autre profil sans être admin,
            ou tentative de changer un rôle sans être admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lists:
    get:
      tags: [Lists]
      summary: Lister les listes de l'utilisateur connecté
      responses:
        "200":
          description: Tableau de listes (uniquement celles de l'utilisateur connecté)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/List"
        "401":
          description: Authentification manquante ou token invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unauthorized
    post:
      tags: [Lists]
      summary: Créer une nouvelle liste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListInput"
      responses:
        "201":
          description: Liste créée (ownerId = utilisateur courant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          description: Titre vide ou absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentification manquante ou token invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lists/{id}:
    patch:
      tags: [Lists]
      summary: Modifier une liste (titre, position)
      description: Réservé à l'auteur de la liste.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListInput"
      responses:
        "200":
          description: Liste mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          description: Payload invalide (ex. titre vide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Liste introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Lists]
      summary: Supprimer une liste
      description: |
        Réservé à l'auteur de la liste.
        Les cartes associées sont supprimées en cascade (voir README).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Liste (et ses cartes) supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Liste introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lists/{listId}/cards:
    get:
      tags: [Cards]
      summary: Lister les cartes d'une liste
      description: Réservé à l'auteur de la liste. Les cartes sont triées par position croissante.
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tableau de cartes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Liste introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Cards]
      summary: Créer une nouvelle carte dans une liste
      description: Réservé à l'auteur de la liste.
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardInput"
      responses:
        "201":
          description: Carte créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: Payload invalide (ex. titre manquant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Liste introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cards/{id}:
    get:
      tags: [Cards]
      summary: Récupérer une carte
      description: Réservé à l'auteur de la liste parente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Carte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste parente appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Carte introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Cards]
      summary: Modifier une carte (titre, description, position, liste)
      description: >
        Réservé à l'auteur de la liste parente. En cas de déplacement (changement de `listId`),
        l'utilisateur doit aussi être l'auteur de la liste cible, sinon 403.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardInput"
      responses:
        "200":
          description: Carte mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: Payload invalide (ex. titre vide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste parente ou liste cible appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Carte ou liste cible introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Cards]
      summary: Supprimer une carte
      description: Réservé à l'auteur de la liste parente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Carte supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Liste parente appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Carte introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentification manquante ou invalide
    Forbidden:
      description: >
        Authentifié, mais accès refusé — soit parce que la ressource (liste/carte) appartient à un
        autre utilisateur, soit parce que l'action requiert un rôle (ex. admin) que l'utilisateur n'a pas.
    NotFound:
      description: Ressource introuvable
    BadRequest:
      description: Requête invalide

  schemas:
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]

    AuthToken:
      type: object
      description: Jeton retourné après une connexion réussie.
      properties:
        accessToken:
          type: string
          description: >
            JSON Web Token (JWT). Contient au minimum l'identifiant de l'utilisateur (claim `sub`)
            et une date d'expiration (claim `exp`). Ne contient jamais le mot de passe.

    User:
      type: object
      description: >
        Représentation publique d'un utilisateur. Le champ `password` n'existe volontairement pas
        dans ce schéma : il ne doit jamais être sérialisé dans une réponse API, quelle que soit la route.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    CreateListInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        position:
          type: integer

    UpdateListInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        position:
          type: integer

    List:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCardInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        position:
          type: integer

    UpdateCardInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        position:
          type: integer
        listId:
          type: string
          format: uuid

    Card:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        position:
          type: integer
        listId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
